<!DOCTYPE html>
{% load static %}
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SMS update</title>
    <meta content="" name="description" />
    <meta content="" name="keywords" />

    <!-- Favicons -->
    <link href="{% static 'assets/img/favicon.png' %}" rel="icon" />
    <link
      href="{% static 'assets/img/apple-touch-icon.png' %}"
      rel="apple-touch-icon"
    />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Raleway:300,300i,400,400i,500,500i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i"
      rel="stylesheet"
    />

    <!-- Vendor CSS Files -->
    <link href="{% static 'assets/vendor/aos/aos.css' %}" rel="stylesheet" />
    <link
      href="{% static 'assets/vendor/bootstrap/css/bootstrap.min.css' %}"
      rel="stylesheet"
    />
    <link
      href="{% static 'assets/vendor/bootstrap-icons/bootstrap-icons.css' %}"
      rel="stylesheet"
    />
    <link
      href="{% static 'assets/vendor/boxicons/css/boxicons.min.css' %}"
      rel="stylesheet"
    />
    <link
      href="{% static 'assets/vendor/glightbox/css/glightbox.min.css' %}"
      rel="stylesheet"
    />
    <link
      href="{% static 'assets/vendor/remixicon/remixicon.css' %}"
      rel="stylesheet"
    />
    <link
      href="{% static 'assets/vendor/swiper/swiper-bundle.min.css' %}"
      rel="stylesheet"
    />

    <link href="{% static 'assets/css/style.css' %}" rel="stylesheet" />
  </head>

<body>
    <div class="container">   
        <header id="header" class="fixed-top d-flex align-items-center">
            <div class="container d-flex align-items-center justify-content-between">
              <div class="logo">
                <h1><a href="index.html">SMS</a></h1>
              </div>
      
              <nav id="navbar" class="navbar">
                <ul>
                  <li><a class="nav-link scrollto active" href="{% url 'home'%}">Home</a></li>
                  <li><a class="nav-link scrollto" href="{% url 'exam'%}">Create_profile</a></li>
                  <li><a class="nav-link scrollto" href="#services">Login</a></li>
      
                  <li>
                    <a class="nav-link scrollto" href="#contact">Contact With Us</a>
                  </li>
                  <li>
                    <a class="getstarted scrollto" href="#about">Add Students</a>
                  </li>
                </ul>
                <i class="bi bi-list mobile-nav-toggle"></i>
              </nav>
            </div>
          </header>
      
        <h1 class="text-center">Data entry form:</h1>
        <div class="pt-5">
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" value="{{stu.name}}" class="form-control" id="name" name="name" placeholder="Enter your name">
                </div>
    
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" value="{{stu.email}}" class="form-control" id="email" name="email" placeholder="Enter your email">
                </div>

                <div class="mb-3">
                    <img style="height: 150px;width: 150px;" src="{{stu.image.url}}" alt="">
                </div>

                <div class="mb-3">
                    <label for="file" class="form-label">Upload Image</label>
                    <input type="file" class="form-control" id="file" name="file">
                </div>
    
                <div class="mb-3">
                    <label for="roll" class="form-label">Roll Number</label>
                    <input type="number" value="{{stu.roll}}" class="form-control" id="roll" name="roll" placeholder="Enter your roll">
                </div>
    
                <div class="mb-3">
                  <label for="gender">Gender:</label>
                  <select name="gender" id="gender">
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                  </select>
                </div>
    
                <div class="mb-3">
                    <label for="religion" class="form-label">Religion</label>
                    <input type="text" value="{{stu.religion}}" class="form-control"name="religion" placeholder="Your religion">
                </div>
    
                <div class="mb-3">
                    <label class="form-label">Is Bangladeshi</label>
                    <input type="checkbox" value="False" class="form-check-input" name="is_Bangladeshi">
                </div>
    
                <div class="mb-3">
                    <label class="form-label">Date of Birth</label>
                    <input type="date" value="{{stu.date_of_birth}}" class="form-control" name="date_of_birth">
                </div>
    
                <div class="mb-3">
                    <label for="age" class="form-label">Age</label>
                    <input type="number" value="{{stu.age}}" class="form-control" id="age" name="age" placeholder="Enter your age">
                </div>
                <div class="mb-3">
                    <label for="hobby" class="form-label">Hobby</label>
                    <input type="text" value="{{stu.hobby}}" class="form-control"  name="hobby" placeholder="Enter your hobby">
                </div>
    
                <button type="submit" class="btn btn-success w-100">Submit</button>
            </form>
        </div>
        
        <br>
        <button class="btn border-none"><a class="text-white" href="{% url 'first' %}">Go to data page</a></button><br><br><br>   
          <a
            href="#"
            class="back-to-top d-flex align-items-center justify-content-center"
            ><i class="bi bi-arrow-up-short"></i
          ></a>
      
          <script src="{% static 'assets/vendor/purecounter/purecounter_vanilla.js' %}"></script>
          <script src="{% static 'assets/vendor/aos/aos.js' %}"></script>
          <script src="{% static 'assets/vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
          <script src="{% static 'assets/vendor/glightbox/js/glightbox.min.js' %}"></script>
          <script src="{% static 'assets/vendor/isotope-layout/isotope.pkgd.min.js' %}"></script>
          <script src="{% static 'assets/vendor/swiper/swiper-bundle.min.js' %}"></script>
          <script src="{% static 'assets/vendor/php-email-form/validate.js' %}"></script>
      
          <script src="{% static 'assets/js/main.js' %}"></script>
          </div>
          <footer id="footer">
            <div class="container">
              <div class="row d-flex align-items-center">
                <div class="col-lg-6 text-lg-left text-center">
                  <div class="copyright">
                    &copy; Copyright <strong>Vesperr</strong>. All Rights Reserved
                  </div>
                  <div class="credits">
                    Designed by <a href="https://bootstrapmade.com/">BootstrapMade</a>
                  </div>
                </div>
                <div class="col-lg-6">
                  <nav class="footer-links text-lg-right text-center pt-2 pt-lg-0">
                    <a href="#intro" class="scrollto">Home</a>
                    <a href="#about" class="scrollto">About</a>
                    <a href="#">Privacy Policy</a>
                    <a href="#">Terms of Use</a>
                  </nav>
                </div>
              </div>
            </div>
          </footer>
        </body>
      </html>
